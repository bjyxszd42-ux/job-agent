<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Browser · job-agent</title>
<style>
  :root{
    --bg:#faf9f7; --surface:#fff; --surface-2:#f4f2ef; --surface-3:#eceae5;
    --ink:#1c1a17; --ink-2:#5b554d; --ink-3:#8d8579;
    --line:#e5e1da; --line-2:#d6d0c6;
    --accent:#b4552d; --accent-soft:#fdf0e9;
    --teal:#2f6f6a; --teal-soft:#e8f2f1;
    --blue:#3a5a8c; --blue-soft:#eaf0f8;
    --gold:#8a6d1f; --gold-soft:#f8f1dc;
    --r:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#16150f; --surface:#1f1e18; --surface-2:#26251e; --surface-3:#2f2e26;
      --ink:#f0ece3; --ink-2:#b4ada0; --ink-3:#847d70;
      --line:#33312a; --line-2:#413e35;
      --accent:#e08a5f; --accent-soft:#3a251b;
      --teal:#6fb5ae; --teal-soft:#1b2f2d;
      --blue:#8aa8d4; --blue-soft:#1c2635;
      --gold:#d4b45c; --gold-soft:#312a15;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
  }
  button{font:inherit; cursor:pointer}
  a{color:inherit}

  header{
    display:flex; align-items:center; gap:16px; padding:12px 20px;
    background:var(--surface); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .brand{font-weight:700; font-size:15px; white-space:nowrap; letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  .stat{font-size:12.5px; color:var(--ink-3); white-space:nowrap}
  .stat b{color:var(--ink); font-weight:650}
  #q{
    flex:1; min-width:120px; padding:7px 12px; border:1px solid var(--line-2);
    background:var(--bg); color:var(--ink); border-radius:8px; font-size:13.5px;
  }
  #q:focus{outline:2px solid var(--accent); outline-offset:-1px}

  .wrap{display:flex; flex:1; min-height:0}
  aside{
    width:264px; flex:0 0 264px; overflow-y:auto; padding:16px;
    background:var(--surface); border-right:1px solid var(--line);
  }
  main{flex:1; overflow-y:auto; padding:16px 20px 60px}

  .fgroup{margin-bottom:20px}
  .flabel{
    font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
    font-weight:650; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;
  }
  .flabel button{
    background:none; border:none; color:var(--accent); font-size:11px; padding:0;
    text-transform:none; letter-spacing:0;
  }
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chip{
    padding:4px 9px; border-radius:20px; border:1px solid var(--line-2);
    background:var(--bg); color:var(--ink-2); font-size:12px; white-space:nowrap;
  }
  .chip:hover{border-color:var(--ink-3)}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .fam-group{font-size:11px; color:var(--ink-3); margin:11px 0 5px; font-weight:650; letter-spacing:.03em}
  .fam-group:first-child{margin-top:0}
  select,input[type=text]{
    width:100%; padding:6px 9px; border:1px solid var(--line-2); border-radius:7px;
    background:var(--bg); color:var(--ink); font-size:13px;
  }
  .toggle{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); padding:3px 0; cursor:pointer}
  .toggle input{accent-color:var(--accent); width:15px; height:15px}

  .listhead{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:12px; font-size:13px; color:var(--ink-2); gap:12px;
  }
  .listhead b{color:var(--ink); font-size:15px}
  .job{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:13px 15px; margin-bottom:9px;
  }
  .job:hover{border-color:var(--line-2)}
  .job.marked-interested{border-left:3px solid var(--teal)}
  .job.marked-applied{border-left:3px solid var(--accent); opacity:.72}
  .jt{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
  .jt h3{margin:0 0 3px; font-size:15px; font-weight:650; line-height:1.35}
  .jt h3 a{text-decoration:none}
  .jt h3 a:hover{color:var(--accent); text-decoration:underline}
  .meta{font-size:12.5px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:3px 10px; align-items:center}
  .co{font-weight:600; color:var(--ink)}
  .badges{display:flex; gap:5px; flex-wrap:wrap; margin-top:7px}
  .b{font-size:11px; padding:2px 7px; border-radius:5px; font-weight:600; white-space:nowrap}
  .b-fam{background:var(--blue-soft); color:var(--blue)}
  .b-sen{background:var(--surface-3); color:var(--ink-2)}
  .b-rem{background:var(--teal-soft); color:var(--teal)}
  .b-new{background:var(--accent-soft); color:var(--accent)}
  .b-pay{background:var(--teal-soft); color:var(--teal)}
  .snip{
    font-size:12.5px; color:var(--ink-3); margin-top:8px; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .acts{display:flex; gap:6px; flex:0 0 auto}
  .acts button{
    padding:4px 10px; border-radius:7px; border:1px solid var(--line-2);
    background:var(--bg); color:var(--ink-2); font-size:12px; white-space:nowrap;
  }
  .acts button:hover{border-color:var(--ink-3); color:var(--ink)}
  .acts button.on{background:var(--teal); border-color:var(--teal); color:#fff}
  .acts button.on-a{background:var(--accent); border-color:var(--accent); color:#fff}
  .more{
    display:block; width:100%; padding:11px; margin-top:6px; border-radius:var(--r);
    border:1px dashed var(--line-2); background:var(--surface); color:var(--ink-2); font-size:13px;
  }
  .more:hover{border-color:var(--accent); color:var(--accent)}
  .empty{text-align:center; padding:60px 20px; color:var(--ink-3)}
  .empty b{display:block; font-size:16px; color:var(--ink-2); margin-bottom:6px}
  code{background:var(--surface-3); padding:1px 5px; border-radius:4px; font-size:12.5px}

  @media (max-width:820px){
    .wrap{flex-direction:column}
    aside{width:auto; flex:0 0 auto; border-right:none; border-bottom:1px solid var(--line); max-height:38vh}
    header{flex-wrap:wrap}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Job<span>Browser</span></div>
  <input id="q" type="search" placeholder="Search title, company, keyword…" autocomplete="off">
  <div class="stat" id="stat">Loading…</div>
</header>

<div class="wrap">
  <aside>
    <div class="fgroup">
      <div class="flabel">Posted</div>
      <div class="chips" id="f-time"></div>
    </div>

    <div class="fgroup">
      <div class="flabel">Level</div>
      <div class="chips" id="f-sen"></div>
    </div>

    <div class="fgroup">
      <div class="flabel">Location</div>
      <label class="toggle"><input type="checkbox" id="f-remote"> Remote only</label>
      <input type="text" id="f-state" placeholder="States, e.g. NY, CA, MA" style="margin-top:7px">
    </div>

    <div class="fgroup">
      <div class="flabel">Filters</div>
      <label class="toggle"><input type="checkbox" id="f-pay"> Salary posted only</label>
      <label class="toggle"><input type="checkbox" id="f-mine"> Saved &amp; applied only</label>
    </div>

    <div class="fgroup">
      <div class="flabel">
        Job family
        <button id="clear-fam">Clear</button>
      </div>
      <div id="f-fam"></div>
    </div>
  </aside>

  <main>
    <div class="listhead">
      <div><b id="count">—</b> <span id="countsub"></span></div>
      <select id="sort" style="width:auto">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="co">Company A–Z</option>
        <option value="title">Title A–Z</option>
      </select>
    </div>
    <div id="list"></div>
    <button class="more" id="more" hidden>Load more</button>
  </main>
</div>

<script>
const PAGE = 60;
let JOBS = [], TAX = { families: [], groups: {} }, MARKS = {};
let shown = PAGE, filtered = [];

const S = {
  q: '', time: 'all', sen: 'all', remote: false, states: [],
  payOnly: false, mineOnly: false, fams: new Set(), sort: 'new',
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const SEN_LABEL = {
  intern:'Intern', entry:'Entry', mid:'Mid', senior:'Senior',
  staff:'Staff', manager:'Manager', director:'Director', exec:'Exec',
};

function rel(iso) {
  if (!iso) return '';
  const h = (Date.now() - Date.parse(iso)) / 36e5;
  if (h < 1) return 'just now';
  if (h < 24) return `${Math.floor(h)}h ago`;
  const d = Math.floor(h / 24);
  if (d === 1) return 'yesterday';
  if (d < 30) return `${d}d ago`;
  const mo = Math.floor(d / 30);
  return mo === 1 ? '1 month ago' : `${mo} months ago`;
}

async function boot() {
  try {
    const [j, t, m] = await Promise.all([
      fetch('/data/jobs.json').then((r) => r.json()),
      fetch('/data/taxonomy.json').then((r) => r.json()).catch(() => TAX),
      fetch('/api/marks').then((r) => r.json()).catch(() => ({})),
    ]);
    JOBS = j.jobs || [];
    TAX = t; MARKS = m;
    const when = (j.generatedAt || '').slice(0, 16).replace('T', ' ');
    $('stat').innerHTML =
      `<b>${JOBS.length.toLocaleString()}</b> indexed · ${(j.total || 0).toLocaleString()} scraped · updated ${when} UTC`;
    buildFilters();
    apply();
  } catch (e) {
    $('list').innerHTML =
      `<div class="empty"><b>Couldn't load job data</b>Make sure <code>data/jobs.json</code> exists — run <code>npm run scrape</code> first.<br><br>${esc(e.message)}</div>`;
    $('stat').textContent = 'no data';
  }
}

function buildFilters() {
  const times = [['all','Any time'],['1','24 hours'],['3','3 days'],['7','7 days'],['30','30 days']];
  $('f-time').innerHTML = times.map(([v, l]) =>
    `<button class="chip${S.time === v ? ' on' : ''}" data-t="${v}">${l}</button>`).join('');
  $('f-time').onclick = (e) => { const b = e.target.closest('[data-t]'); if (!b) return; S.time = b.dataset.t; buildFilters(); apply(); };

  const sens = [['all','Any'],['intern','Intern'],['entry','Entry'],['mid','Mid'],['senior','Senior'],['staff','Staff'],['manager','Manager']];
  $('f-sen').innerHTML = sens.map(([v, l]) =>
    `<button class="chip${S.sen === v ? ' on' : ''}" data-s="${v}">${l}</button>`).join('');
  $('f-sen').onclick = (e) => { const b = e.target.closest('[data-s]'); if (!b) return; S.sen = b.dataset.s; buildFilters(); apply(); };

  // Only show families that actually appear in the index, grouped, with counts
  const used = new Map();
  for (const j of JOBS) for (const f of (j.families || [])) used.set(f, (used.get(f) || 0) + 1);
  const byGroup = {};
  for (const f of (TAX.families || [])) {
    if (!used.has(f.key)) continue;
    (byGroup[f.group || 'other'] ||= []).push({ ...f, n: used.get(f.key) });
  }
  let html = '';
  for (const [g, list] of Object.entries(byGroup)) {
    list.sort((a, b) => b.n - a.n);
    html += `<div class="fam-group">${esc(TAX.groups?.[g] || g)}</div><div class="chips">`;
    html += list.map((f) =>
      `<button class="chip${S.fams.has(f.key) ? ' on' : ''}" data-f="${esc(f.key)}">${esc(f.label)} <span style="opacity:.6">${f.n}</span></button>`).join('');
    html += '</div>';
  }
  $('f-fam').innerHTML = html || '<div style="font-size:12px;color:var(--ink-3)">No families in this index</div>';
  $('f-fam').onclick = (e) => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const k = b.dataset.f;
    S.fams.has(k) ? S.fams.delete(k) : S.fams.add(k);
    buildFilters(); apply();
  };
}

function apply() {
  const q = S.q.toLowerCase().trim();
  const cutoff = S.time === 'all' ? 0 : Date.now() - parseInt(S.time, 10) * 864e5;

  filtered = JOBS.filter((j) => {
    if (S.payOnly && !j.compensationRaw) return false;
    if (S.remote && !j.location?.isRemote) return false;
    if (S.sen !== 'all' && j.seniority !== S.sen) return false;
    if (S.fams.size && !(j.families || []).some((f) => S.fams.has(f))) return false;
    if (cutoff && Date.parse(j.postedAt || j.firstSeenAt) < cutoff) return false;
    if (S.states.length) {
      const st = j.location?.states || [];
      if (!st.some((s) => S.states.includes(s)) && !j.location?.isRemote) return false;
    }
    const mk = MARKS[j.id]?.state;
    if (mk === 'hidden') return false;
    if (S.mineOnly && !mk) return false;
    if (q) {
      const hay = `${j.title} ${j.company} ${j.department} ${j.location?.raw} ${j.snippet}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const dir = { new: -1, old: 1 }[S.sort];
  if (dir) filtered.sort((a, b) => dir * (Date.parse(a.postedAt || 0) - Date.parse(b.postedAt || 0)));
  else if (S.sort === 'co') filtered.sort((a, b) => String(a.company).localeCompare(String(b.company)) || String(a.title).localeCompare(String(b.title)));
  else filtered.sort((a, b) => String(a.title).localeCompare(String(b.title)));

  shown = PAGE;
  render();
}

function render() {
  $('count').textContent = filtered.length.toLocaleString();
  const saved = Object.values(MARKS).filter((m) => m.state === 'interested').length;
  const applied = Object.values(MARKS).filter((m) => m.state === 'applied').length;
  const bits = ['jobs'];
  if (saved) bits.push(`${saved} saved`);
  if (applied) bits.push(`${applied} applied`);
  $('countsub').textContent = bits.join(' · ');

  if (!filtered.length) {
    $('list').innerHTML = '<div class="empty"><b>No matching jobs</b>Try loosening the filters.</div>';
    $('more').hidden = true;
    return;
  }

  $('list').innerHTML = filtered.slice(0, shown).map(card).join('');
  $('more').hidden = shown >= filtered.length;
  $('more').textContent = `Load more (${(filtered.length - shown).toLocaleString()} remaining)`;
}

function card(j) {
  const loc = j.location || {};
  const where = loc.isRemote
    ? (loc.states?.length ? `Remote · ${loc.states.join('/')}` : 'Remote')
    : (loc.states?.length ? `${loc.cities?.[0] ? loc.cities[0] + ', ' : ''}${loc.states.join('/')}` : (loc.raw || '—'));
  const posted = j.postedAt || j.firstSeenAt;
  const isNew = Date.now() - Date.parse(posted) < 864e5;
  const mk = MARKS[j.id]?.state;
  const famNames = (j.families || []).map((f) =>
    (TAX.families || []).find((x) => x.key === f)?.label || f);

  return `<div class="job ${mk ? 'marked-' + mk : ''}" data-id="${esc(j.id)}">
    <div class="jt">
      <div style="min-width:0">
        <h3><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h3>
        <div class="meta">
          <span class="co">${esc(j.company)}</span>
          <span>${esc(where)}</span>
          <span>${rel(posted)}</span>
          ${j.department ? `<span style="opacity:.7">${esc(j.department)}</span>` : ''}
        </div>
      </div>
      <div class="acts">
        <button data-act="interested" class="${mk === 'interested' ? 'on' : ''}">${mk === 'interested' ? '✓ Saved' : 'Save'}</button>
        <button data-act="applied" class="${mk === 'applied' ? 'on-a' : ''}">${mk === 'applied' ? '✓ Applied' : 'Applied'}</button>
        <button data-act="hidden" title="Hide this job">×</button>
      </div>
    </div>
    <div class="badges">
      ${isNew ? '<span class="b b-new">New today</span>' : ''}
      ${famNames.map((f) => `<span class="b b-fam">${esc(f)}</span>`).join('')}
      <span class="b b-sen">${SEN_LABEL[j.seniority] || esc(j.seniority)}</span>
      ${loc.isRemote ? '<span class="b b-rem">Remote</span>' : ''}
      ${j.compensationRaw ? `<span class="b b-pay">${esc(j.compensationRaw)}</span>` : ''}
    </div>
    ${j.snippet ? `<div class="snip">${esc(j.snippet)}</div>` : ''}
  </div>`;
}

async function mark(id, state) {
  if (MARKS[id]?.state === state) state = null;   // clicking the same button again clears it
  if (state) MARKS[id] = { state, at: new Date().toISOString() };
  else delete MARKS[id];
  render();
  try {
    await fetch('/api/marks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, state }),
    });
  } catch { /* a failed write doesn't break browsing; state reloads from disk */ }
}

let t;
$('q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { S.q = e.target.value; apply(); }, 180); };
$('sort').onchange = (e) => { S.sort = e.target.value; apply(); };
$('f-remote').onchange = (e) => { S.remote = e.target.checked; apply(); };
$('f-pay').onchange = (e) => { S.payOnly = e.target.checked; apply(); };
$('f-mine').onchange = (e) => { S.mineOnly = e.target.checked; apply(); };
$('f-state').oninput = (e) => {
  clearTimeout(t);
  t = setTimeout(() => {
    S.states = e.target.value.toUpperCase().split(/[,\s]+/).filter((s) => /^[A-Z]{2}$/.test(s));
    apply();
  }, 300);
};
$('clear-fam').onclick = () => { S.fams.clear(); buildFilters(); apply(); };
$('more').onclick = () => { shown += PAGE; render(); };
$('list').onclick = (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.job')?.dataset.id;
  if (id) mark(id, b.dataset.act);
};
document.querySelector('main').onscroll = (e) => {
  const el = e.target;
  if (el.scrollTop + el.clientHeight > el.scrollHeight - 400 && shown < filtered.length) {
    shown += PAGE; render();
  }
};

boot();
</script>
</body>
</html>
